name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare static files
        run: |
          # Determine export directory location
          if [ -d ".next/export" ]; then
            EXPORT_DIR=".next/export"
          elif [ -d "out" ]; then
            EXPORT_DIR="out"
          else
            # Fallback: create out from .next/static
            echo "No export directory found, checking .next structure..."
            ls -la .next/
            exit 1
          fi
          
          echo "Using export directory: $EXPORT_DIR"
          
          # Copy public assets to export directory
          cp -r public/* "$EXPORT_DIR/" 2>/dev/null || true
          # Add .nojekyll for GitHub Pages
          touch "$EXPORT_DIR/.nojekyll"
          
          # If export dir is not 'out', move it
          if [ "$EXPORT_DIR" != "out" ]; then
            mv "$EXPORT_DIR" out
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
